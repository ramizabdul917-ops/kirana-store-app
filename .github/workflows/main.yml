name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'
        cache: true

    - name: Fix Gradle Config & local.properties
      working-directory: ./kirana_store_app
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        # Purane apply script ko safe injection provide karna
        if [ -f android/app/build.gradle ]; then
          sed -i 's/apply from: "\$flutterRoot\/packages\/flutter_tools\/gradle\/flutter.gradle"/apply plugin: "com.android.application"\napply plugin: "kotlin-android"\napply plugin: "dev.flutter.flutter-gradle-plugin"/g' android/app/build.gradle || true
        fi
        flutter pub get

    - name: Build APK
      working-directory: ./kirana_store_app
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kirana-app-release
        path: kirana_store_app/build/app/outputs/flutter-apk/app-release.apk
