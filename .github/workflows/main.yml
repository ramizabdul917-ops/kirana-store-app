name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter 3.16.9
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'
        cache: true

    - name: Fix Compatibility & Dependencies
      working-directory: ./kirana_store_app
      run: |
        echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
        # image_picker version ko Dart 3.2.6 ke sath compatible banana
        sed -i 's/image_picker:.*/image_picker: ^1.0.8/g' pubspec.yaml
        flutter clean
        flutter pub get

    - name: Build Release APK
      working-directory: ./kirana_store_app
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kirana-app-release
        path: kirana_store_app/build/app/outputs/flutter-apk/app-release.apk
